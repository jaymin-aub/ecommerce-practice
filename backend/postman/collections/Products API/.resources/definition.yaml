$kind: collection
name: Products API
description: CRUD API for products, served by app.ts (Express). Protected by JWT authentication (authMiddleware). Run the requests in order - the create request adds product 31, and the later requests read, update, patch and delete it.
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{auth_token}}'
variables:
  - key: base_url
    value: 'http://localhost:3000'
    description: Base URL of the local server (npm run dev)
  - key: product_id
    value: '31'
    description: Id of the product created by the Create request
  - key: auth_token
    value: ''
    description: Bearer token from Login or Signup
scripts:
  - type: http:afterResponse
    language: text/javascript
    code: |-
      pm.test('Responds in under 1000ms', () => {
        pm.expect(pm.response.responseTime).to.be.below(1000);
      });
