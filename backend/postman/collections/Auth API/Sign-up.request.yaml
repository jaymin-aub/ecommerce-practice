$kind: http-request
name: Sign up
method: POST
url: "{{base_url}}/api/auth/signup"
order: 1000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "firstName": "John",
      "lastName": "Doe",
      "age": 28,
      "gender": "male",
      "email": "johndoe@example.com",
      "username": "johndoe",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 201', () => pm.response.to.have.status(201));
      pm.test('Signup returns success and auth token', () => {
        const res = pm.response.json();
        pm.expect(res.success).to.be.true;
        pm.expect(res.message).to.eql('Signup Successful');
        pm.expect(res.token).to.be.a('string').that.is.not.empty;
        pm.expect(res.data).to.have.property('id');
        pm.expect(res.data.email).to.eql('johndoe@example.com');
        pm.environment.set('auth_token', res.token);
      });
